<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger A–D engineering integration — synthetic only</title>
<link rel="stylesheet" href="../../src/ui/system/tokens.css">
<style>body{margin:0;padding:1rem;font:1rem system-ui;background:#f5f7f9} main{max-width:920px;margin:auto}
button,input,select,textarea{font:inherit;padding:.55rem;margin:.25rem}
.cv-editor{display:grid;gap:1rem}.cv-preview{padding:1rem;background:#fff;border:1px solid #bbb}
.cv-editor-form fieldset{display:grid;gap:.5rem}.cv-editor-form label{display:block}
.cv-editor-form input,.cv-editor-form textarea{display:block;width:100%;box-sizing:border-box}
pre{white-space:pre-wrap;overflow-wrap:anywhere}.cv-item{border:1px solid #bbb;padding:.6rem}
@media(min-width:800px){.cv-editor{grid-template-columns:1fr 1fr}}
</style></head><body><main class="ledger-platform-root">
<h1>Ledger CV Studio — A–D Integration Preview</h1>
<p>Engineering demonstration only. Uses fictional records in a separate IndexedDB database.
This is not the public CV builder and must not be used for private CVs.</p>
<button id="run" type="button">Run synthetic A–D workflow</button>
<button id="mount" type="button" disabled>Open connected CV editor</button>
<button id="reopen" type="button">Reopen saved synthetic profile</button>
<p id="status" role="status" aria-live="polite">Not started.</p>
<pre id="results" aria-label="Synthetic integration evidence"></pre>
<div id="editor-host"></div>
<script type="module">
import {runSyntheticJourney} from '../../src/integration/ad-journey.mjs';
import {createIndexedDBRevisionStore} from '../../src/domain/storage/revision-store.mjs';
import {replaceMasterDocument} from '../../src/domain/profile/career-profile.mjs';
import {createFeatureRegistry} from '../../src/core/feature-registry.mjs';
import {createFrontendComposition} from '../../src/core/composition-root.mjs';
import {editorFeature} from '../../src/features/documents/index.mjs';
const status=document.getElementById('status'),results=document.getElementById('results');
const run=document.getElementById('run'),mount=document.getElementById('mount'),reopen=document.getElementById('reopen');
const store=createIndexedDBRevisionStore({databaseName:'ledger_cv_ad_synthetic_dev_v1'});
let profileId=null,active=null;
const documentSource={
 async load(){
  if(!profileId)throw Error('Run or reopen a synthetic profile first');
  active=await store.load(profileId);
  if(!active)throw Error('Synthetic profile is missing');
  return {document:active.value.master.document,appearance:active.value.master.appearance};
 },
 async save({document:doc,appearance}){
  if(!active)throw Error('No synthetic profile loaded');
  const updated=replaceMasterDocument(active.value,{document:doc,appearance,
   expectedRevision:active.revision,confirmed:true});
  active=await store.save(profileId,updated,active.revision);
 }
};
const registry=createFeatureRegistry();registry.register(editorFeature);
const composition=createFrontendComposition({registry,
 host:document.getElementById('editor-host'),routes:{'/editor':'cv-editor'},services:{documentSource}});
async function open(){
 await composition.navigate('/editor');
 mount.disabled=true;
 status.textContent='Connected editor opened with separate IndexedDB persistence.';
}
run.addEventListener('click',async()=>{
 run.disabled=true;status.textContent='Running synthetic checks…';
 try{
  const output=await runSyntheticJourney({repository:store});
  profileId=output.profileId;results.textContent=JSON.stringify(output,null,2);
  mount.disabled=false;status.textContent='PASS synthetic A-D workflow.';
 }catch(error){status.textContent='FAIL: '+error.message}
 finally{run.disabled=false}
});
mount.addEventListener('click',()=>void open().catch(e=>{status.textContent='Editor error: '+e.message}));
reopen.addEventListener('click',async()=>{
 try{
  const ids=await store.listIds();if(!ids.length)throw Error('No synthetic profiles found');
  profileId=ids[ids.length-1];await open();
 }catch(e){status.textContent='Reopen error: '+e.message}
});
</script></main></body></html>
