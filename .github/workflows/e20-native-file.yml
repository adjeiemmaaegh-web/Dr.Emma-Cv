name: Ledger E20 native file smoke (Linux Chromium only, NO-GO)

on:
  push:
    branches: [review/e20-offline-calendar-2026-11-06]
  pull_request:
    paths:
      - 'development/e20/**'
      - 'tests/e20_native_file_smoke.py'
      - 'tests/e20_native_calendar_acceptance.py'
      - 'tests/e20_native_document_acceptance.py'
      - '.github/workflows/e20-native-file.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-file-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium browser harness
        run: |
          python -m pip install 'playwright==1.57.0' 'pymupdf==1.26.5'
          python -m playwright install chromium --with-deps
      - name: Check real file protocol, exact E20 identity and restart persistence
        run: python tests/e20_native_file_smoke.py
      - name: Verify native file calendar review, cross-tab safety and quota denial
        run: python tests/e20_native_calendar_acceptance.py
      - name: Verify real-file A4 and Letter Word packages and text-extractable native PDFs
        run: python tests/e20_native_document_acceptance.py
