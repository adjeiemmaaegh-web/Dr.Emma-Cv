name: Ledger E0 checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Baseline parity, storage inventory and unit tests
        run: npm run verify:e0
      - name: Reject obvious committed credential patterns
        shell: bash
        run: |
          if grep -R -I -n -E '(sk-proj-[A-Za-z0-9_-]{12,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
              --include='*.js' --include='*.mjs' --include='*.ts' --include='*.json' \
              --exclude-dir='.git' --exclude-dir='node_modules' .; then
            echo 'Possible credential found. Revoke/rotate and investigate.'
            exit 1
          fi
