name: Ledger E21 Word import privacy (development only)

on:
  push:
    branches: [review/e21-docx-style-privacy-2026-11-07]
  pull_request:
    paths:
      - 'development/e21/**'
      - 'tests/e21_native_docx_style.py'
      - '.github/workflows/e21-docx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-docx-style:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium browser
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install chromium
      - name: Verify Word style-hidden text is excluded via real file origin
        run: python tests/e21_native_docx_style.py
