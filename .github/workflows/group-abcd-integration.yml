name: Ledger A-D combined integration QA (NO DEPLOY)
on:
  push:
    branches: [integration/abcd-stage-gates-2026-11-17]
  pull_request:
    branches: [feat/ws-a-stages-00-03-foundation-2026-11-17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen E0 regression baseline
        run: npm run verify:e0
      - name: Group A platform contracts and persistence model
        run: npm run verify:platform
      - name: B, C, D modules and new integration regressions
        run: node --test tests/documents/documents.test.mjs tests/intelligence/intelligence.test.mjs tests/career/career.test.mjs
      - name: Preserve E31 and E30 candidate settings
        run: node tools/audit-e31-e30-preservation.mjs
  combined-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright Chromium runtime for smoke test
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Mount Group B editor through Group A composition, test 320px/desktop and save race
        run: node tests/documents/editor-browser.mjs
  platform-native-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Chromium browser QA
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Test Group A real IndexedDB and reload behavior
        run: python tests/platform/platform_browser.py
